name: Actualizar ofertas de la CNMC

on:
  schedule:
    # De madrugada: ofertas de la CNMC y precios del PVPC de hoy.
    - cron: '0 5 * * *'
    # Por la tarde (21:30 en invierno, 22:30 en verano): precios del PVPC de mañana,
    # que Red Eléctrica publica hacia las 20:15.
    - cron: '30 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar los filtros
        # Si los filtros fallan, la tarea se para (GitHub avisa por correo) y no se publica nada.
        run: python test_filtros.py
      - name: Generar reglas.json
        # Aplica los filtros automáticos y la comprobación semanal de las webs (verificaciones.json).
        run: python actualizar_ofertas.py --salida reglas.json
      - name: Generar pvpc.json
        # Si ESIOS falla, se sigue con el pvpc.json de ayer y se publican las ofertas igual.
        run: python actualizar_pvpc.py --salida pvpc.json || echo "No se ha podido actualizar el PVPC."
      - name: Publicar si ha cambiado
        run: |
          if git diff --quiet -- reglas.json pvpc.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "casaenvatios-bot"
          git config user.email "casa.en.vatios@gmail.com"
          git add reglas.json pvpc.json
          git commit -m "Ofertas y PVPC del $(date '+%d/%m/%Y %H:%M')"
          git push
      - name: Aviso de ofertas sospechosas
        # Una incidencia abierta con la lista (solo avisa al crearla; luego se actualiza en silencio
        # y se cierra sola cuando ya no hay ninguna). Es informativa: no hace falta hacer nada.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label dudosas --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -s informe-dudosas.md ]; then
            if [ -z "$n" ]; then
              gh label create dudosas --color E0A100 --description "Ofertas con datos que no cuadran" --force
              gh issue create --title "Ofertas sospechosas (se revisan solas)" --label dudosas --body-file informe-dudosas.md
            else
              gh issue edit "$n" --body-file informe-dudosas.md
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Ya no hay ofertas sospechosas."
          fi
